<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scalt Mini App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
/* Layout: одна «телефонная» колонка (≤440px) на чёрном звёздном небе; снизу стеклянная панель вкладок.
   Движение: небо (canvas), 3D-подарок на главной (three.js), живые подарки (Lottie), блеск на кнопках.
   При prefers-reduced-motion всё замирает в статичном кадре. */
:root{
  color-scheme: dark;
  --bg:#08080A; --sheet:#141416; --ph:#18181B;
  --fg:#F6F6F4; --muted:#A1A1A7; --dim:#6C6C72;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --glass:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  --hi:inset 0 1px 0 rgba(255,255,255,.1);
  --chip:rgba(255,255,255,.1);
  --cta:#F6F6F4; --on-cta:#08080A;
  --ok:#86DDA6; --ok-bg:rgba(134,221,166,.12);
  --warn:#EDC06A; --warn-bg:rgba(237,192,106,.12);
  --bad:#FF8F85; --bad-bg:rgba(255,143,133,.12);
  --f-ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-brand:"Playfair Display", Georgia, "Times New Roman", serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --sb:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:400 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;z-index:1}
#view{position:relative}

/* Шапка */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;height:58px;padding-left:var(--gl);padding-right:var(--gr);border-bottom:1px solid transparent;transition:background .25s,border-color .25s}
.hdr.scrolled{background:rgba(8,8,10,.74);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:7px;font:italic 600 23px/1 var(--f-brand);letter-spacing:-.01em}
.brand svg{width:14px;height:14px;animation:twirl 6s ease-in-out infinite}
@keyframes twirl{0%,80%,100%{transform:rotate(0) scale(1)}90%{transform:rotate(90deg) scale(1.25)}}
.backp{display:inline-flex;align-items:center;gap:3px;height:34px;padding:0 14px 0 9px;border-radius:99px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi);font-size:14px;font-weight:600}
.backp svg{width:17px;height:17px}
.balchip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi);font:700 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.balchip svg{width:14px;height:14px;opacity:.75}
.balchip.bump{animation:bump .9s ease-out}
@keyframes bump{0%{box-shadow:var(--hi),0 0 0 0 rgba(255,255,255,.5)}30%{transform:scale(1.08)}100%{transform:none;box-shadow:var(--hi),0 0 0 14px rgba(255,255,255,0)}}

/* Экран */
.screen{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:4px calc(112px + var(--sb));display:flex;flex-direction:column;gap:16px}
body.has-bar .screen{padding-bottom:calc(200px + var(--sb))}
.screen.fwd{animation:inR .26s cubic-bezier(.2,.8,.2,1)}
.screen.bk{animation:inL .26s cubic-bezier(.2,.8,.2,1)}
/* класс «fade», а не «tab»: .tab — это кнопка нижней панели (grid + центрирование), совпадение имён ломало вёрстку экрана */
.screen.fade{animation:inF .3s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(18px)}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}}
@keyframes inF{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi);border-radius:22px}
.pt{margin:2px 0 0;font:800 30px/1.1 var(--f-ui);letter-spacing:-.025em}
.lead{margin:-8px 0 0;color:var(--muted);font-size:14px}
.eyebrow{font:700 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Сияние: бегущий блик по рамке (featured-карточка, активные элементы) */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.glow{position:relative;isolation:isolate}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 62%,rgba(255,255,255,.85) 75%,transparent 88%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinb 5s linear infinite;pointer-events:none;z-index:3}
@keyframes spinb{to{--ang:360deg}}
/* Блик, пробегающий по тёмной стеклянной кнопке */
.sweep{position:relative;overflow:hidden}
.sweep::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);animation:sweep 5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,62%{left:-60%}100%{left:135%}}

/* Главная: 3D-сцена */
.stage{position:relative;height:262px;margin:0 -8px;touch-action:pan-y}
.stage .halo{position:absolute;left:50%;top:48%;width:300px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,255,255,.16),rgba(255,255,255,.04) 55%,transparent);animation:halo 4s ease-in-out infinite;pointer-events:none}
@keyframes halo{50%{opacity:.6;transform:translate(-50%,-50%) scale(.92)}}
.stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s;cursor:grab}
.stage canvas.gl:active{cursor:grabbing}
.stage.ready canvas.gl{opacity:1}
.hero-fb{position:absolute;inset:18px 0 0;display:grid;place-items:center;transition:opacity .6s}
.hero-fb svg{width:210px;height:auto;animation:float 6s ease-in-out infinite}
.stage.ready .hero-fb{opacity:0}
@keyframes float{50%{transform:translateY(-6px)}}
.spk{position:absolute;width:var(--s);height:var(--s);pointer-events:none;animation:tw 3s ease-in-out infinite var(--d);opacity:.15}
.spk::before{content:"";position:absolute;inset:-60%;background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent)}
.spk::after{content:"";position:absolute;inset:0;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.45) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.hero-t{margin:-6px 0 0;text-align:center;font:800 30px/1.08 var(--f-ui);letter-spacing:-.03em;text-wrap:balance}
.hero-s{margin:-6px auto 0;text-align:center;color:var(--muted);font-size:14px;max-width:32ch}
.cta2{display:grid;gap:10px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.feat-i{display:grid;justify-items:center;gap:2px;padding:12px 4px;border-radius:16px;text-align:center}
.feat-i b{font-size:15px;font-weight:800}
.feat-i span{font-size:11.5px;color:var(--muted)}
.feat{display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;align-items:center;padding:10px;border-radius:24px;cursor:pointer}
.feat-art{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--ph)}
.feat-art img{width:100%;height:100%;object-fit:cover}
.feat-info{display:grid;gap:5px;min-width:0}
.feat-t{font:800 20px/1.15 var(--f-ui);letter-spacing:-.01em;overflow-wrap:anywhere}
.feat-s{font-size:13px;color:var(--muted)}
.feat-p{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.minibtn{justify-self:start;display:inline-flex;align-items:center;gap:3px;height:32px;padding:0 12px 0 14px;border-radius:99px;background:var(--cta);color:var(--on-cta);font-size:13px;font-weight:700;margin-top:2px}
.minibtn svg{width:15px;height:15px}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sech h2{margin:0;font:800 21px/1.2 var(--f-ui);letter-spacing:-.015em}
.link{color:var(--muted);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:2px}
.link svg{width:16px;height:16px}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:44%;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr);scroll-padding-left:var(--gl)}
.hs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.foot{text-align:center;font-size:12px;color:var(--dim);padding-top:4px}

/* Живой подарок (Lottie) поверх статичной картинки */
.lot{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.lot.live{opacity:1}
.lot canvas{display:block}

/* Карточка подарка */
.gcard{display:flex;flex-direction:column;padding:7px 7px 10px;border-radius:20px;cursor:pointer;scroll-snap-align:start;min-width:0;transition:transform .15s}
.gcard:active{transform:scale(.97)}
.gimg{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--ph)}
.gimg img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:99px;background:rgba(8,8,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:700 11px/1 var(--f-ui);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tag svg{width:11px;height:11px}
.tag.n{top:7px;left:7px}.tag.m{right:7px;bottom:7px}
.gmeta{padding:9px 4px 0;display:grid;gap:2px;min-width:0}
.gname{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.gprice{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cart{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line)}
.cart svg{width:17px;height:17px}

/* Маркет */
.intro{display:grid;gap:10px;padding:16px}
.intro p{margin:0;color:var(--muted);font-size:13.5px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:600}
.pill svg{width:13px;height:13px}
/* Ряды на всю ширину экрана с прокруткой внутри. contain:inline-size и явная ширина обязательны:
   иначе при первом показе ряд принимал ширину своего содержимого (403px) и раздвигал страницу. */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
.chips,.hs{flex:none;min-width:0;width:calc(100% + var(--gl) + var(--gr));contain:inline-size}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:600}
.chip svg{width:14px;height:14px}
.chip.on{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:99px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font-size:16px;padding:0}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{filter:invert(1);opacity:.5}
.ibtn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--glass);box-shadow:var(--hi);border:1px solid var(--line)}
.ibtn svg{width:20px;height:20px}
.fbtn{position:relative;width:46px;height:46px}
.fbtn.on::after{content:"";position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--fg)}
.count{font-size:13px;color:var(--muted);margin-bottom:-6px;min-height:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:36px 16px;color:var(--muted)}
.empty h3{margin:0;color:var(--fg);font:800 21px/1.2 var(--f-ui)}
.empty .btn{width:auto;height:46px;margin-top:6px}
.empty-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--glass);margin-bottom:4px;color:var(--fg)}
.empty-ic svg{width:28px;height:28px}

/* Страница подарка */
.dimg{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--ph);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.dimg > img{width:100%;height:100%;object-fit:cover}
.dimg .tag{font-size:12px;padding:6px 10px}
.dimg .tag.n{top:12px;left:12px}.dimg .tag.m{right:12px;bottom:12px}
.dhead{display:grid;gap:4px}
.dhead h1{margin:0;font:800 30px/1.1 var(--f-ui);letter-spacing:-.025em}
.dhead p{margin:0;color:var(--muted)}
.attrs{padding:2px 16px}
.arow{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;align-items:center;gap:12px;min-height:50px}
.arow+.arow{border-top:1px solid var(--line)}
.arow svg{width:20px;height:20px;color:var(--muted)}
.arow .k{color:var(--muted);font-size:14px}
.arow .v{justify-self:end;text-align:right;font-weight:600;font-size:14.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rar{font:700 12px/1 var(--f-ui);padding:5px 8px;border-radius:99px;background:var(--chip);font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:calc(84px + var(--sb));z-index:29;padding:0 var(--gr) 0 var(--gl)}
.bar-in{max-width:408px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:10px 10px 10px 16px;border-radius:24px;background:rgba(20,20,23,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line-2);box-shadow:var(--hi),0 12px 40px rgba(0,0,0,.5)}
.bar-price small{display:block;font-size:12px;color:var(--muted)}
.bar-price b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .btn{height:50px}

/* Кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;padding:0 22px;border-radius:99px;font-size:16px;font-weight:700;transition:transform .12s,opacity .2s;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-p{background:var(--cta);color:var(--on-cta);box-shadow:0 0 0 0 rgba(255,255,255,0);animation:pulse 3.2s ease-in-out infinite}
.btn-p:disabled{animation:none}
@keyframes pulse{50%{box-shadow:0 0 28px 2px rgba(255,255,255,.16)}}
.btn-g{background:var(--glass);border:1px solid var(--line-2);box-shadow:var(--hi)}
.btn-d{color:var(--bad)}

/* Вкладки, списки */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:99px}
.seg button{height:40px;border-radius:99px;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0}
.seg button.on{background:var(--cta);color:var(--on-cta)}
.seg.s3 button{font-size:13px;gap:4px}
.cnt{font:700 11px/1 var(--f-ui);padding:3px 7px;border-radius:99px;background:var(--chip)}
.seg .on .cnt{background:rgba(0,0,0,.12)}
.list{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px 9px 9px;border-radius:18px;width:100%;text-align:left;transition:transform .15s}
.lrow:active{transform:scale(.985)}
.thumb{position:relative;width:56px;height:56px;border-radius:13px;overflow:hidden;background:var(--ph);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.ic{display:grid;place-items:center;font:700 22px/1 var(--f-ui);border:1px solid var(--line);background:rgba(255,255,255,.04)}
.lt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ls{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;margin-top:2px}
.ls svg{width:12px;height:12px;flex:none}
.lr{display:grid;justify-items:end;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.lr .amt{font-size:14px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.lgo{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted)}
.lgo svg{width:18px;height:18px;color:var(--dim)}
.st{font:700 12px/1 var(--f-ui);padding:5px 9px;border-radius:99px;white-space:nowrap}
.st.wait{color:var(--warn);background:var(--warn-bg)}
.st.ok{color:var(--ok);background:var(--ok-bg)}
.st.bad{color:var(--bad);background:var(--bad-bg)}
.st.done{color:var(--fg);background:var(--chip)}
.st.off{color:var(--dim);background:rgba(255,255,255,.05)}

/* Вывод, пополнение */
.wcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center;padding:12px;border-radius:22px}
.wcard .thumb{width:104px;height:104px;border-radius:16px}
.wcard h2{margin:0 0 4px;font:800 22px/1.15 var(--f-ui);overflow-wrap:anywhere}
.kvs{border-radius:20px;padding:2px 0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 16px;font-size:15px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.kv.neg b{color:var(--bad)}
.note{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:14px 16px;border-radius:18px;font-size:13.5px;color:var(--muted);line-height:1.45}
.note svg{width:20px;height:20px}
/* minmax(0,1fr) и width:100% обязательны: у input есть собственная ширина (атрибут size),
   и без них поле распирало страницу до ~600px — телефон уменьшал масштаб всего экрана. */
.amt-box{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.amt-l{font-size:13px;color:var(--muted)}
.amt-in{display:flex;align-items:baseline;gap:8px}
.amt-in input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font:800 40px/1.15 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0}

.cp{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--fg)}

.big-sum{text-align:center;display:grid;gap:4px;padding:4px 0}
.big-sum small{color:var(--muted);font-size:13px}
.big-sum b{font:800 38px/1.1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.upl{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1px dashed var(--line-2);cursor:pointer}
.upl svg{width:22px;height:22px}
.upl b{display:block;font-weight:600;font-size:15px}
.upl small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.upl input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.upl:focus-within{outline:2px solid var(--fg);outline-offset:2px}

.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font:800 26px/1 var(--f-ui);background:linear-gradient(145deg,#3a3a3f,#141416);border:1px solid var(--line-2)}

.prof h1{margin:0;font:800 22px/1.15 var(--f-ui);overflow-wrap:anywhere}
.prof p{margin:2px 0 0;color:var(--muted);font-size:14px}
.balcard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:16px 16px 16px 18px}
.balcard small{display:block;font-size:12.5px;color:var(--muted)}
.balcard b{font:800 28px/1.15 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}

.balp{font-size:12.5px;color:var(--warn)}
.menu{border-radius:20px;padding:2px 0}
.mi{display:grid;grid-template-columns:36px minmax(0,1fr) auto 18px;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 14px;text-align:left;font-size:15px;font-weight:600}

.tab svg{width:21px;height:21px}

  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && Array.isArray(s.listing)) return s; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

   В Telegram «Назад» — нативная кнопка в шапке Telegram, поэтому свою кнопку не дублируем. */
let tg = null, tgUser = null;

/* ---------- Звёздное небо ----------
   Один canvas на всё приложение: мерцающие точки, крестики и четырёхлучевые звёзды медленно
   поднимаются, иногда пролетает падающая звезда. Останавливается, когда вкладка скрыта. */
(function sky() {
  const cv = $('#sky'), ctx = cv.getContext('2d');
  let W = 0, H = 0, stars = [], shoot = null, nextShoot = performance.now() + 2500, raf = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 8500);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, k: Math.random() < .3 ? 2 : Math.random() < .5 ? 1 : 0,
      s: .6 + Math.random(), p: Math.random() * 6.28, v: .5 + Math.random() * 1.6, a: .2 + Math.random() * .55, dy: .03 + Math.random() * .08,
    }));
    if (RM) draw(0);
  }
  function star4(x, y, r) {
    const k = r * .22;
    ctx.beginPath(); ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x + k, y - k, x + r, y); ctx.quadraticCurveTo(x + k, y + k, x, y + r);
    ctx.quadraticCurveTo(x - k, y + k, x - r, y); ctx.quadraticCurveTo(x - k, y - k, x, y - r); ctx.fill();
  }
  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const tw = .5 + .5 * Math.sin(t * .001 * s.v + s.p), al = s.a * (.2 + .8 * tw);
      if (!RM) { s.y -= s.dy; if (s.y < -10) { s.y = H + 10; s.x = Math.random() * W; } }
      ctx.fillStyle = ctx.strokeStyle = `rgba(255,255,255,${al.toFixed(3)})`;
      if (s.k === 2) star4(s.x, s.y, (2.2 + 3 * s.s) * (.65 + .35 * tw));
      else if (s.k === 1) { const r = 2.2 * s.s; ctx.lineWidth = .9; ctx.beginPath(); ctx.moveTo(s.x - r, s.y - r); ctx.lineTo(s.x + r, s.y + r); ctx.moveTo(s.x + r, s.y - r); ctx.lineTo(s.x - r, s.y + r); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(s.x, s.y, .7 * s.s, 0, 6.29); ctx.fill(); }
    }
    if (RM) return;
    if (!shoot && t > nextShoot) { shoot = { x: W * (.35 + Math.random() * .6), y: H * Math.random() * .35, life: 0 }; nextShoot = t + 5000 + Math.random() * 7000; }
    if (shoot) {
      const L = 55, len = 110, p = shoot.life / L, hx = shoot.x - p * 260, hy = shoot.y + p * 130;
      const g = ctx.createLinearGradient(hx, hy, hx + len * .9, hy - len * .45);
      const a = Math.sin(Math.PI * p);
      g.addColorStop(0, `rgba(255,255,255,${(.9 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + len * .9, hy - len * .45); ctx.stroke();
      if (++shoot.life > L) shoot = null;
    }
  }
  function loop(t) { raf = 0; draw(t); if (!document.hidden) raf = requestAnimationFrame(loop); }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf && !RM) raf = requestAnimationFrame(loop); });
  resize();
  if (!RM) raf = requestAnimationFrame(loop);
})();

/* ---------- 3D-подарок на главной (three.js) ----------
   Сцена создаётся один раз и переиспользуется: canvas переносится в новый .stage при каждом
   показе главной. Пока three.js грузится или если WebGL недоступен, виден SVG-подарок.
   Рендер идёт только когда сцена видна на экране; палец двигает вращение с инерцией. */
const HERO = { st: null, loading: null };
function mountHero() {
  const stage = $('#stage');
  if (!stage) return;
  (HERO.loading || (HERO.loading = window.THREE ? Promise.resolve() : loadScript(THREE_URL))).then(() => {
    if (!stage.isConnected) return;
    if (!HERO.st) HERO.st = buildHero();
    if (!HERO.st) return;
    stage.appendChild(HERO.st.canvas);
    HERO.st.attach(stage);
    stage.classList.add('ready');
  }).catch(() => { HERO.loading = null; });
}
function buildHero() {
  const T = window.THREE;
  const canvas = document.createElement('canvas'); canvas.className = 'gl'; canvas.setAttribute('aria-label', '3D-подарок, можно покрутить');
  let renderer;
  try { renderer = new T.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'low-power' }); } catch (e) { return null; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.setClearColor(0x000000, 0);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(30, 1, .1, 50); cam.position.set(0, 1.45, 6.5); cam.lookAt(0, .92, 0);

  // Студийное окружение для отражений: тёмный купол, пол и яркие световые панели, запечённые в PMREM.
  // ВАЖНО: env.background не задавать цветом — в three r128 PMREM кодирует сплошной фон с ошибкой
  // (почти чёрный превращается в светло-серый), и всё начинает отражать ровную серую заливку.
  const env = new T.Scene();
  const lit = k => new T.MeshBasicMaterial({ color: new T.Color(k, k, k), side: T.DoubleSide });
  env.add(new T.Mesh(new T.SphereGeometry(20, 32, 16), new T.MeshBasicMaterial({ color: new T.Color(.012, .012, .014), side: T.BackSide })));
  const panel = (w, h, pos, rot, k) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), lit(k)); m.position.set(...pos); m.rotation.set(...rot); env.add(m); };
  panel(6, 6, [0, 8, 0], [Math.PI / 2, 0, 0], 3);            // большой верхний софтбокс
  panel(1.2, 9, [-7, 1, 1], [0, Math.PI / 2, 0], 3);         // левая полоса
  panel(.8, 9, [7, 1, -1], [0, -Math.PI / 2, 0], 2);         // правая полоса
  panel(9, 1, [0, 2, -7], [0, 0, 0], 1.5);                   // контровой свет сзади
  panel(7, 1.6, [0, -.5, 7], [0, Math.PI, 0], 1.1);          // мягкий фронт: подсвечивает ленту со стороны камеры
  panel(30, 30, [0, -4, 0], [-Math.PI / 2, 0, 0], .07);      // серый пол для нижних граней
  const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, .03).texture; pm.dispose();

  // Чёрный лак: тёмная основа почти без металла + зеркальный лаковый слой, дающий только блики.
  const black = new T.MeshPhysicalMaterial({ color: 0x0b0b0c, metalness: .2, roughness: .35, clearcoat: 1, clearcoatRoughness: .04 });
  const chrome = new T.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .07 });
  // Плоская лента из зеркального хрома при взгляде в лоб отражает пустоту и темнеет; матовое серебро светится под любым углом.
  const satin = new T.MeshStandardMaterial({ color: 0xe8e8ec, metalness: 1, roughness: .32 });
  const rr = (w, d, r) => { const s = new T.Shape(), x = -w / 2, y = -d / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r);
    s.quadraticCurveTo(x + w, y + d, x + w - r, y + d); s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
  // Скруглённая плита высотой h, стоящая на y=0 (выдавливание по z → поворот на -90° вокруг x).
  const slab = (w, d, h, r, b) => { const g = new T.ExtrudeGeometry(rr(w - 2 * b, d - 2 * b, r), { depth: h - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 8 }); g.rotateX(-Math.PI / 2); g.translate(0, b, 0); return g; };
  const gift = new T.Group();
  gift.add(new T.Mesh(slab(1.7, 1.7, 1.25, .12, .05), black));
  const lid = new T.Mesh(slab(1.86, 1.86, .34, .14, .05), black); lid.position.y = 1.22; gift.add(lid);
  const band = (w, h, d, y) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), satin); m.position.y = y; gift.add(m); };
  band(.3, 1.24, 1.72, .62); band(1.72, 1.24, .3, .62); band(.3, .37, 1.885, 1.39); band(1.885, .37, .3, 1.39);
  const loopG = new T.TorusGeometry(.3, .085, 20, 64);
  for (const s of [-1, 1]) { const m = new T.Mesh(loopG, chrome); m.position.set(s * .36, 1.78, 0); m.scale.set(1.15, .75, .6); m.rotation.set(0, s * .25, s * .5); gift.add(m); }
  const knot = new T.Mesh(new T.SphereGeometry(.14, 24, 16), chrome); knot.position.set(0, 1.66, 0); knot.scale.set(1.15, .85, 1); gift.add(knot);
  // Медальон со звездой Scalt на каждой из четырёх сторон
  const sr = .16, sk = sr * .22, starS = new T.Shape();
  starS.moveTo(0, sr); starS.quadraticCurveTo(sk, sk, sr, 0); starS.quadraticCurveTo(sk, -sk, 0, -sr); starS.quadraticCurveTo(-sk, -sk, -sr, 0); starS.quadraticCurveTo(-sk, sk, 0, sr);
  const starG = new T.ExtrudeGeometry(starS, { depth: .03, bevelEnabled: true, bevelThickness: .012, bevelSize: .01, bevelSegments: 2, curveSegments: 10 });
  const discG = new T.CylinderGeometry(.25, .25, .03, 48); discG.rotateX(Math.PI / 2);
  const ringG = new T.TorusGeometry(.25, .022, 12, 64);
  for (let i = 0; i < 4; i++) {
    const e = new T.Group(), st = new T.Mesh(starG, chrome); st.position.z = .01;
    e.add(new T.Mesh(discG, black), new T.Mesh(ringG, chrome), st); e.position.set(0, .62, .885);
    const w = new T.Group(); w.add(e); w.rotation.y = i * Math.PI / 2; gift.add(w);
  }
  gift.rotation.x = .1; scene.add(gift);
  // Орбита с бегущим огоньком: настоящая 3D-окружность, уходит за подарок и выходит перед ним
  const ring = new T.Mesh(new T.TorusGeometry(2.05, .007, 8, 220), new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .4 }));
  ring.rotation.set(Math.PI / 2 - .3, 0, .22); ring.position.y = .85; scene.add(ring);
  const dot = new T.Mesh(new T.SphereGeometry(.05, 16, 12), new T.MeshBasicMaterial({ color: 0xffffff })); scene.add(dot);
  const gc = document.createElement('canvas'); gc.width = gc.height = 64;
  const gx = gc.getContext('2d'), gr = gx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); gx.fillStyle = gr; gx.fillRect(0, 0, 64, 64);
  const glow = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(gc), transparent: true, depthWrite: false, blending: T.AdditiveBlending })); glow.scale.set(.55, .55, 1); scene.add(glow);

  let raf = 0, rotY = .7, vel = .006, drag = false, lx = 0, vis = true, stage = null, io = null;
  const t0 = performance.now(), v = new T.Vector3();
  function size() { if (!stage) return; const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  function frame(now) {
    raf = 0;
    const t = (now - t0) / 1000;
    if (!drag) { vel += (.006 - vel) * .04; rotY += vel; }
    gift.rotation.y = rotY; gift.position.y = -.02 + Math.sin(t * 1.3) * .07;
    const a = t * .9; v.set(Math.cos(a) * 2.05, Math.sin(a) * 2.05, 0); ring.updateMatrixWorld(); ring.localToWorld(v);
    dot.position.copy(v); glow.position.copy(v);
    renderer.render(scene, cam);
    if (stage && vis && !document.hidden && !RM) raf = requestAnimationFrame(frame);
  }
  const start = () => { if (!raf) raf = requestAnimationFrame(frame); };
  canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; vel = 0; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} if (RM) start(); });
  canvas.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - lx; lx = e.clientX; rotY += dx * .012; vel = dx * .012; if (RM) start(); });
  const up = () => { drag = false; }; canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  addEventListener('resize', size);

    canvas,
    attach(st) { stage = st; size(); vis = true; if (io) io.disconnect(); io = new IntersectionObserver(es => { vis = es[0].isIntersecting; if (vis) start(); }); io.observe(st); start(); },
    stop() { cancelAnimationFrame(raf); raf = 0; if (io) io.disconnect(); io = null; stage = null; },
  };
}

/* ---------- Живые подарки (Lottie) ----------
   Анимация грузится лениво и ложится поверх статичной картинки (.lot.live = плавное появление).
   JSON храним текстом и парсим заново для каждой копии: lottie-web меняет переданный объект.
   Все анимации экрана уничтожаются при смене экрана, иначе они продолжают тратить CPU. */
const LOT = { lib: null, texts: new Map(), live: new Set() };
function ensureLottie() { return LOT.lib || (LOT.lib = loadScript(LOTTIE_URL).then(() => window.lottie, e => { LOT.lib = null; throw e; })); }
function animText(g) {
  if (!LOT.texts.has(g.id)) LOT.texts.set(g.id, fetch(IMG + g.anim).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).catch(e => { LOT.texts.delete(g.id); throw e; }));
  return LOT.texts.get(g.id);
}
function liveGift(el, g, bucket = LOT.live) {
  if (RM || !el || !g) return;
  Promise.all([ensureLottie(), animText(g)]).then(([L, txt]) => {
    if (!el.isConnected || el.dataset.on) return;
    el.dataset.on = '1';
    const a = L.loadAnimation({ container: el, renderer: 'canvas', loop: true, autoplay: true, animationData: JSON.parse(txt), rendererSettings: { preserveAspectRatio: 'xMidYMid slice', clearCanvas: true } });
    a.addEventListener('DOMLoaded', () => el.classList.add('live'));
    bucket.add(a);
  }).catch(() => {});                      // статичная картинка остаётся — это и есть запасной вариант
}
const liveAll = (root, bucket) => root.querySelectorAll('[data-live]').forEach(el => liveGift(el, G[el.dataset.live], bucket));
function killAnims(bucket) { bucket.forEach(a => { try { a.destroy(); } catch (e) {} }); bucket.clear(); }

/* ---------- Форматирование ---------- */
function when(ts) {
  const d = new Date(ts), n = new Date();
  const t = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / DAY);
  if (diff === 0) return 'Сегодня, ' + t;
  if (diff === 1) return 'Вчера, ' + t;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + t;
}
const DEP_ST = { wait:['wait','На проверке'], ok:['ok','Зачислено'], bad:['bad','Отклонено'] };
const WD_ST = { wait:['wait','Ожидает'], work:['wait','В работе'], done:['done','Выдан'], cancel:['off','Отменена'], bad:['bad','Отклонена'] };
const pill = ([cls, label]) => `<span class="st ${cls}">${label}</span>`;
const activeReqs = () => state.deposits.filter(d => d.status === 'wait').length + state.withdrawals.filter(w => w.status === 'wait' || w.status === 'work').length;
const thumb = g => `<div class="thumb"><img src="${IMG}${g.img}" alt="" loading="lazy" decoding="async"></div>`;
const gsub = g => `#${g.num} · ${mkIc(g.market)}${MK[g.market]}`;

/* ---------- Навигация ----------
   Четыре корневые вкладки внизу; внутри вкладки — стек экранов. «Назад» возвращает на предыдущий
   экран с сохранёнными данными и прокруткой. После отправки заявки формы убираются из стека,
   чтобы «Назад» не вело к повторной отправке. */
const ROOTS = [['home','home','Главная'], ['catalog','store','Маркет'], ['inventory','box','Хранилище'], ['profile','user','Профиль']];
let stack = [{ name: 'home', params: {} }];
const top = () => stack[stack.length - 1];
const view = $('#view'), hdr = $('#hdr'), bar = $('#bar'), tabsEl = $('#tabs'), toastEl = $('#toast');
let lastBal = state.balance;
function go(name, params = {}) { top().scroll = scrollY; stack.push({ name, params }); render('fwd'); }
function back() { if (stack.length > 1) { stack.pop(); render('bk'); } }
function replaceTop(name, params = {}) { stack[stack.length - 1] = { name, params }; render('fwd'); }
function tabGo(name) {
  closeSheet();
  if (stack.length === 1 && top().name === name) { scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); return; }
  stack = [{ name, params: {} }]; render('tab');
}
function rerender() { const y = scrollY; render('none'); scrollTo(0, y); }

function render(dir) {
  killAnims(LOT.live);
  if (HERO.st) HERO.st.stop();
  const t = top(), s = SCREENS[t.name](t.params);
  view.innerHTML = `<section class="screen ${dir === 'fwd' ? 'fwd' : dir === 'bk' ? 'bk' : dir === 'tab' ? 'fade' : ''}">${s.html}</section>`;
  header();
  tabs();
  if (s.bar) { bar.innerHTML = `<div class="bar-in">${s.bar}</div>`; bar.hidden = false; document.body.classList.add('has-bar'); }
  else { bar.hidden = true; bar.innerHTML = ''; document.body.classList.remove('has-bar'); }
  if (s.mount) s.mount();
  liveAll(view, LOT.live);
  if (dir === 'bk') scrollTo(0, t.scroll || 0); else if (dir === 'fwd' || dir === 'tab') scrollTo(0, 0);
  if (tg) (stack.length > 1 || sheetOpen) ? tg.BackButton.show() : tg.BackButton.hide();
}
function header() {
  const canBack = stack.length > 1 && !tg;
  hdr.innerHTML = `
    ${canBack ? `<button class="backp" data-act="back">${ic('back')}Назад</button>` : `<div class="brand">${STAR}Scalt</div>`}
    <button class="balchip" data-act="topup" aria-label="Баланс ${fmt(state.balance)}, пополнить">${ic('wallet')}<span>${fmt(state.balance)}</span></button>`;
  if (state.balance !== lastBal) { lastBal = state.balance; const c = $('.balchip', hdr); if (!RM) c.classList.add('bump'); }
}
function tabs() {
  const root = stack[0].name, i = ROOTS.findIndex(r => r[0] === root), inv = state.owned.length;
  if (!tabsEl.firstChild) {
    tabsEl.innerHTML = `<div class="tabs-in"><span class="tab-pill" id="tabpill"></span>${ROOTS.map(([n, icn, label]) =>
      `<button class="tab" data-act="tabgo" data-to="${n}">${ic(icn)}<span>${label}</span></button>`).join('')}</div>`;
  }
  tabsEl.querySelectorAll('.tab').forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-current', j === i ? 'page' : 'false'); });
  $('#tabpill').style.transform = `translateX(${Math.max(0, i) * 100}%)`;
  void inv;
}

/* Пока открыта клавиатура, нижние панели прячем: иначе на Android они всплывают над клавиатурой и закрывают поле. */

function renderGrid() {
  const q = cat.q.trim().toLowerCase().replace(/^#/, '');
  const list = state.listing.map(id => G[id]).filter(g =>
    (cat.market === 'all' || g.market === cat.market) &&
    (!q || `${g.title} ${g.model[0]} ${g.backdrop[0]} ${g.num}`.toLowerCase().includes(q)));
  if (cat.sort === 'cheap') list.sort((a, b) => a.price - b.price);
  else if (cat.sort === 'exp') list.sort((a, b) => b.price - a.price);
  else if (cat.sort === 'rare') list.sort((a, b) => parseFloat(a.model[1]) - parseFloat(b.model[1]));
  $('#count').textContent = list.length ? `${list.length} ${plural(list.length, 'подарок', 'подарка', 'подарков')}${cat.market !== 'all' ? ' на ' + MK[cat.market] : ''}` : '';
  const grid = $('#grid');
  grid.className = list.length ? 'grid' : '';
  grid.innerHTML = list.length ? list.map(card).join('')
    : empty('Ничего не нашли', 'Попробуйте другое название или маркет.', `<button class="btn btn-g" data-act="resetFilters">Сбросить фильтры</button>`, 'search');
}

/* Поле суммы: только цифры, проверка лимитов и подсветка быстрых сумм без перерисовки экрана (иначе пропадёт фокус). */
function amountChanged(p) {
  const inp = $('#amount'), err = $('#amt-e'), next = $('#next');
  if (!inp) return;
  const n = +(inp.value.replace(/\D/g, '').slice(0, 8)) || 0;
  p.amount = n;
  inp.value = n ? n.toLocaleString('ru-RU') : '';
  const ok = n >= MIN && n <= MAX;
  err.textContent = !n ? `От ${fmt(MIN)} до ${fmt(MAX)}` : n < MIN ? `Минимум ${fmt(MIN)}` : n > MAX ? `Максимум ${fmt(MAX)}` : `К оплате ${fmt(n)}`;
  err.classList.toggle('bad', !!n && !ok);
  next.disabled = !ok;
  document.querySelectorAll('.qa button').forEach(b => b.classList.toggle('on', +b.dataset.v === n));
}

/* ---------- Шторка и уведомления ---------- */
let sheetOpen = false, ovEl = null, shEl = null, buying = false;
const SHEET_ANIMS = new Set();
function openSheet(html) {
  killAnims(SHEET_ANIMS);
  if (sheetOpen) { shEl.innerHTML = '<div class="grab"></div>' + html; liveAll(shEl, SHEET_ANIMS); return; }
  ovEl = document.createElement('div'); ovEl.className = 'ov'; ovEl.dataset.act = 'close';
  shEl = document.createElement('div'); shEl.className = 'sheet'; shEl.setAttribute('role', 'dialog'); shEl.setAttribute('aria-modal', 'true');
  shEl.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(ovEl, shEl);
  document.body.style.overflow = 'hidden';
  void shEl.offsetHeight;                   // фиксируем начальное положение, чтобы сработала анимация выезда
  ovEl.classList.add('open'); shEl.classList.add('open');
  sheetOpen = true;
  liveAll(shEl, SHEET_ANIMS);
  if (tg) tg.BackButton.show();
  const f = shEl.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function closeSheet() {
  // Пока идёт покупка, шторку не закрываем: процесс уже запущен и должен показать итог.
  if (!sheetOpen || buying) return;
  sheetOpen = false;
  killAnims(SHEET_ANIMS);
  const o = ovEl, s = shEl;
  o.classList.remove('open'); s.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { o.remove(); s.remove(); }, 320);
  if (tg && stack.length <= 1) tg.BackButton.hide();
}
let toastT;
function toast(msg, icon = 'check') {
  toastEl.innerHTML = ic(icon) + '<span>' + esc(msg) + '</span>';
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2800);
}
const sheetHead = g => `<div class="sh-head">${thumb(g)}<div style="min-width:0"><div class="sh-t">${esc(g.title)}</div><div class="sh-s">${gsub(g)}</div></div></div>`;

/* ---------- Покупка ---------- */
const roundUp = n => Math.max(MIN, Math.ceil(n / 500) * 500);
function openBuy(id) {
  const g = G[id];
  if (!state.listing.includes(id)) { toast('Этот подарок уже купили', 'info'); return; }
  const need = g.price - state.balance;
  openSheet(`<div class="sh" id="buysh">
    ${sheetHead(g)}
    <div class="kvs">
      ${kv('Цена', fmt(g.price))}
      ${kv('Ваш баланс', fmt(state.balance))}
      ${need > 0 ? kv('Не хватает', fmt(need), 'neg') : kv('Останется', fmt(state.balance - g.price))}
    </div>
    <p>${need > 0 ? 'Пополните баланс, и подарок можно будет купить.' : `Купим на ${MK[g.market]} сразу после подтверждения. Подарок появится в хранилище.`}</p>
    <div class="btns">
      ${need > 0 ? `<button class="btn btn-p" data-act="topupNeed" data-amount="${roundUp(need)}">${ic('plus')}Пополнить на ${fmt(roundUp(need))}</button>`
                 : `<button class="btn btn-p" data-act="confirmBuy" data-id="${id}">Купить за ${fmt(g.price)}</button>`}
      <button class="btn btn-g" data-act="close">Отмена</button>
    </div></div>`);
}
async function confirmBuy(id) {
  if (buying) return;                       // защита от двойного нажатия
  const g = G[id];
  // Повторная проверка в момент подтверждения: подарок могли купить, баланс мог измениться.
  if (!state.listing.includes(id)) { closeSheet(); toast('Этот подарок уже купили', 'info'); rerender(); return; }
  if (state.balance < g.price) { openBuy(id); return; }
  buying = true; hap();
  const sh = $('#buysh');
  sh.innerHTML = sheetHead(g) + `<div class="steps">${[`Списываем ${fmt(g.price)} с баланса`, `Покупаем на ${MK[g.market]}`, 'Кладём в ваше хранилище']
    .map((s, i) => `<div class="step" id="st${i}"><i></i><span>${esc(s)}</span></div>`).join('')}</div>`;
  for (let i = 0; i < 3; i++) {
    const el = $('#st' + i);
    el.className = 'step run';
    await sleep(i === 1 ? 1200 : 650);
    el.className = 'step done'; el.querySelector('i').innerHTML = ic('check');
  }
  // Состояние меняется одним шагом в конце, чтобы перезагрузка посреди анимации не оставила списание без подарка.
  state.balance -= g.price;
  state.listing = state.listing.filter(x => x !== id);
  state.owned.unshift(id);
  state.purchases.unshift({ id: uid(), gift: id, price: g.price, at: Date.now() });
  save();
  buying = false; hap('ok');
  rerender();
  const sparks = Array.from({ length: 14 }, (_, i) => `<i style="--r:${i * (360 / 14)}deg;--d:${(i % 3) * 90}ms"></i>`).join('');
  sh.innerHTML = `<div class="win"><div class="gimg"><img src="${IMG}${g.img}" alt=""><div class="lot" data-live="${g.id}"></div></div>${sparks}</div>
    <h3>Подарок ваш</h3>
    <p>${esc(g.title)} #${g.num} куплен на ${MK[g.market]} и уже лежит в хранилище. Вывести его в Telegram можно в любой момент.</p>
    <div class="btns"><button class="btn btn-p" data-act="toInv">В хранилище</button><button class="btn btn-g" data-act="more">Продолжить покупки</button></div>`;
  liveAll(sh, SHEET_ANIMS);
}

/* ---------- Пополнения: демо-подтверждение «администратором» ---------- */
const timers = new Set();
function scheduleDeposits() {
  state.deposits.filter(d => d.status === 'wait' && !timers.has(d.id)).forEach(d => {
    timers.add(d.id);
    setTimeout(() => {
      const x = state.deposits.find(y => y.id === d.id);
      if (!x || x.status !== 'wait') return;
      x.status = 'ok'; state.balance += x.amount; save(); hap('ok');
      toast(`Пополнение на ${fmt(x.amount)} зачислено`);
      // На экранах с полями ввода обновляем только шапку, чтобы не сбить ввод.
      if (['topup', 'withdraw', 'catalog'].includes(top().name)) header(); else rerender();
    }, Math.max(1500, d.at + DEMO_CONFIRM_MS - Date.now()));
  });
}

/* ---------- Детали заявок ---------- */
function openReq(kind, id) {
  const u = me();
  if (kind === 'p') {
    const x = state.purchases.find(y => y.id === id); if (!x) return; const g = G[x.gift];
    const canW = state.owned.includes(x.gift);
    openSheet(`<div class="sh">${sheetHead(g)}<div class="kvs">${kv('Статус', pill(['ok','Куплен']))}${kv('Маркет', MK[g.market])}${kv('Цена', fmt(x.price))}${kv('Дата', when(x.at))}</div>
      <div class="btns">${canW ? `<button class="btn btn-p" data-act="withdraw" data-id="${g.id}">${ic('send')}Вывести</button>` : ''}<button class="btn btn-g" data-act="close">Закрыть</button></div></div>`);
  } else if (kind === 'd') {
    const d = state.deposits.find(y => y.id === id); if (!d) return;
    const text = d.status === 'wait' ? 'Проверяем перевод. Баланс пополнится, как только администратор подтвердит платёж. В демо это происходит само через несколько секунд.'
      : d.status === 'ok' ? 'Сумма зачислена на баланс.' : 'Платёж не найден. Напишите в поддержку и приложите чек.';
    openSheet(`<div class="sh"><div class="big-sum"><small>Пополнение</small><b>+${fmt(d.amount)}</b></div>
      <div class="kvs">${kv('Статус', pill(DEP_ST[d.status]))}${kv('Комментарий', d.code)}${kv('Чек', d.receipt ? esc(d.receipt) : 'не прикреплён')}${kv('Дата', when(d.at))}</div>
      <p>${text}</p><div class="btns"><button class="btn btn-g" data-act="close">Закрыть</button></div></div>`);
  } else {
    const w = state.withdrawals.find(y => y.id === id); if (!w) return; const g = G[w.gift];
    const text = { wait: 'Заявка у администратора. Он передаст подарок на ваш аккаунт и отметит заявку выданной.', work: 'Администратор уже передаёт подарок.',
      done: 'Подарок передан на ваш аккаунт Telegram.', cancel: 'Заявка отменена, подарок вернулся в хранилище.', bad: 'Заявка отклонена. Подробности в поддержке.' }[w.status];
    openSheet(`<div class="sh">${sheetHead(g)}<div class="kvs">${kv('Статус', pill(WD_ST[w.status]))}${kv('Получатель', esc(u.handle || u.name))}${kv('Дата', when(w.at))}</div>
      <p>${text}</p><div class="btns">${w.status === 'wait' ? `<button class="btn btn-g btn-d" data-act="cancelW" data-id="${w.id}">Отменить заявку</button>` : ''}<button class="btn btn-g" data-act="close">Закрыть</button></div></div>`);
  }
}

/* ---------- Действия ---------- */
const isRoot = n => ROOTS.some(r => r[0] === n);
const ACT = {
  back: () => back(),
  close: () => closeSheet(),
  tabgo: el => tabGo(el.dataset.to),
  nav: el => { closeSheet(); const to = el.dataset.to; isRoot(to) ? tabGo(to) : go(to, el.dataset.tab ? { tab: el.dataset.tab } : {}); },
  tab: el => { top().params.tab = el.dataset.tab; rerender(); },
  gift: el => go('gift', { id: el.dataset.id }),
  buy: el => openBuy(el.dataset.id),
  confirmBuy: el => confirmBuy(el.dataset.id),
  topup: () => { if (top().name !== 'topup') { closeSheet(); go('topup'); } },
  topupNeed: el => { closeSheet(); go('topup', { amount: +el.dataset.amount }); },
  toInv: () => { closeSheet(); tabGo('inventory'); },
  more: () => {
    closeSheet();
    if (top().name !== 'gift') return;
    stack.length > 1 && stack[stack.length - 2].name === 'catalog' ? back() : tabGo('catalog');
  },
  mk: el => { cat.market = el.dataset.m; rerender(); },
  sort: () => openSheet(`<div class="sh"><h3>Сортировка</h3><div>${SORTS.map(([k, l]) =>
    `<button class="opt ${cat.sort === k ? 'on' : ''}" data-act="setSort" data-s="${k}"><span>${l}</span>${cat.sort === k ? ic('check') : '<span></span>'}</button>`).join('')}</div></div>`),
  setSort: el => { cat.sort = el.dataset.s; closeSheet(); rerender(); },
  resetFilters: () => { cat.market = 'all'; cat.q = ''; cat.sort = 'pop'; rerender(); },
  withdraw: el => { closeSheet(); go('withdraw', { id: el.dataset.id }); },
  sendW: el => {
    const id = el.dataset.id;
    if (!state.owned.includes(id)) return;
    state.owned = state.owned.filter(x => x !== id);
    state.withdrawals.unshift({ id: uid(), gift: id, at: Date.now(), status: 'wait' });
    save(); hap('ok');
    replaceTop('requests', { tab: 'w' });
    toast('Заявка на вывод отправлена');
  },
  cancelW: el => {
    const w = state.withdrawals.find(x => x.id === el.dataset.id);
    if (!w || w.status !== 'wait') return;
    w.status = 'cancel'; state.owned.unshift(w.gift); save();
    closeSheet(); rerender();
    toast('Заявка отменена, подарок в хранилище');
  },
  req: el => openReq(el.dataset.kind, el.dataset.id),
  amt: el => { const inp = $('#amount'); inp.value = el.dataset.v; amountChanged(top().params); },
  topNext: () => { const p = top().params; if (p.amount >= MIN && p.amount <= MAX) go('topup', { step: 2, amount: p.amount, code: p.code }); },
  copy: el => {
    const v = el.dataset.v;
    const fail = () => toast('Скопируйте вручную: ' + v, 'info');
    try { navigator.clipboard.writeText(v).then(() => toast('Скопировано'), fail); } catch (e) { fail(); }
  },
  paid: () => {
    const p = top().params;
    if (!(p.amount >= MIN)) return;
    state.deposits.unshift({ id: uid(), amount: p.amount, code: p.code, at: Date.now(), status: 'wait', receipt: p.receipt || '' });
    save(); scheduleDeposits(); hap('ok');
    stack.length = Math.max(1, stack.findIndex(e => e.name === 'topup'));
    go('requests', { tab: 'd' });
    toast('Заявка на пополнение отправлена');
  },
  how: () => openSheet(`<div class="sh"><h3>Как это работает</h3><ol class="how">
    <li><span class="n">1</span><div><b>Пополните баланс</b><span>Переведите тенге по реквизитам. Администратор проверит платёж и зачислит сумму.</span></div></li>
    <li><span class="n">2</span><div><b>Выберите подарок</b><span>В маркете собраны предложения Portals, MRKT и Tonnel.</span></div></li>
    <li><span class="n">3</span><div><b>Покупка сразу</b><span>Мы покупаем подарок на маркете, где он выставлен, и кладём в ваше хранилище.</span></div></li>
    <li><span class="n">4</span><div><b>Выведите в Telegram</b><span>Оставьте заявку, и администратор передаст подарок на ваш аккаунт.</span></div></li>
    </ol><div class="btns"><button class="btn btn-p" data-act="close">Понятно</button></div></div>`),
  support: () => openSheet(`<div class="sh"><h3>Поддержка</h3><p>Здесь будет кнопка связи с поддержкой магазина. В демо она не подключена.</p><div class="btns"><button class="btn btn-g" data-act="close">Закрыть</button></div></div>`),
  reset: () => openSheet(`<div class="sh"><h3>Сбросить демо?</h3><p>Баланс, хранилище и заявки вернутся к начальным примерам.</p>
    <div class="btns"><button class="btn btn-p" data-act="doReset">Сбросить</button><button class="btn btn-g" data-act="close">Отмена</button></div></div>`),
  doReset: () => { state = seed(); save(); closeSheet(); stack = [{ name: 'home', params: {} }]; render('tab'); toast('Демо-данные сброшены'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'receipt') return;
  const f = e.target.files && e.target.files[0];
  top().params.receipt = f ? f.name : '';
  const r = $('#rname'); if (r) r.textContent = f ? f.name : 'Скриншот или PDF, ускорит проверку';
});

render('none');
scheduleDeposits();
})();
</script>
</body>
</html>
