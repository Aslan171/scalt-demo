<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scalt Mini App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<style>
/* Layout: одна «телефонная» колонка (≤440px) на почти чёрном фоне; стекло только у шапки,
   шторок, кнопок и карточек — по просьбе клиента эффекта liquid glass немного. */
:root{
  color-scheme: dark;
  --bg:#0A0A0B; --sheet:#151517; --ph:#1B1B1E;
  --fg:#F5F5F3; --muted:#A3A3A8; --dim:#6F6F75;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --glass:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  --hi:inset 0 1px 0 rgba(255,255,255,.09);
  --chip:rgba(255,255,255,.1);
  --cta:#F5F5F3; --on-cta:#0A0A0B;
  --ok:#86DDA6; --ok-bg:rgba(134,221,166,.12);
  --warn:#EDC06A; --warn-bg:rgba(237,192,106,.12);
  --bad:#FF8F85; --bad-bg:rgba(255,143,133,.12);
  --f-display:"Playfair Display", Georgia, "Times New Roman", serif;
  --f-ui:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:400 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:440px;margin:0 auto;min-height:100vh;position:relative}
#app::before{content:"";position:absolute;inset:0 0 auto;height:440px;background:radial-gradient(90% 70% at 50% 0%,rgba(255,255,255,.07),transparent 70%);pointer-events:none}
#view{position:relative;z-index:1}

/* Шапка */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;height:58px;padding-left:var(--gl);padding-right:var(--gr);background:rgba(10,10,11,.74);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr-l,.hdr-r{min-width:38px;display:flex}
.hdr-r{justify-content:flex-end}
.hdr-title{justify-self:center;display:flex;align-items:center;gap:8px;min-width:0;font:500 21px/1 var(--f-display);white-space:nowrap}
.hdr-title span{overflow:hidden;text-overflow:ellipsis}
.hdr-title.brand{font-style:italic;font-weight:600;font-size:23px}
.hdr-title svg{width:13px;height:13px;flex:none}
.ibtn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--glass);box-shadow:var(--hi);border:1px solid var(--line)}
.ibtn svg{width:20px;height:20px}
.balchip{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:99px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi);font:600 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.balchip svg{width:14px;height:14px;opacity:.7}
.pill-demo{font:600 10.5px/1 var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border:1px solid var(--line);border-radius:99px}

/* Экран */
.screen{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:6px 40px;display:flex;flex-direction:column;gap:16px}
body.has-bar .screen{padding-bottom:124px}
.screen.fwd{animation:inR .24s cubic-bezier(.2,.8,.2,1)}
.screen.bk{animation:inL .24s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(18px)}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}}
.card{background:var(--glass);border:1px solid var(--line);box-shadow:var(--hi);border-radius:22px}

/* Главная */
.hero{display:grid;justify-items:center;text-align:center;padding-top:2px}
.hero svg{width:196px;height:auto;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.wordmark{margin-top:-4px;padding:0 8px 6px;font:italic 600 60px/1 var(--f-display);letter-spacing:-.02em;background:linear-gradient(180deg,#fff 10%,#cfcfd4 58%,#86868c);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:4px;color:var(--muted);font-size:13px;letter-spacing:.02em}
.bal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 16px 16px 18px}
.bal-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.bal-ic svg{width:22px;height:22px}
.bal-l{font-size:13px;color:var(--muted)}
.bal-v{font:600 28px/1.15 var(--f-ui);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal-p{font-size:12.5px;color:var(--warn);margin-top:2px}
.plus{width:46px;height:46px;border-radius:50%;background:var(--cta);color:var(--on-cta);display:grid;place-items:center}
.plus svg{width:22px;height:22px;stroke-width:2.2}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{position:relative;display:grid;justify-items:center;gap:8px;padding:16px 2px 12px;border-radius:18px;font-size:12px;font-weight:500;text-align:center}
.tile svg{width:24px;height:24px}
.badge{position:absolute;top:7px;right:7px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--cta);color:var(--on-cta);font:700 11px/18px var(--f-ui);text-align:center}
.promo{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:22px}
.promo::-webkit-scrollbar,.hs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:18px;width:100%;text-align:left}
.slide h3{margin:0;font:500 22px/1.15 var(--f-display);text-wrap:balance}
.slide p{margin:6px 0 0;color:var(--muted);font-size:13px}
.mks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.mks span{display:inline-flex;align-items:center;gap:5px}
.mks svg{width:13px;height:13px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line-2);transition:width .2s,background .2s}
.dots i.on{width:18px;background:var(--fg)}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sech h2{margin:0;font:500 22px/1.2 var(--f-display)}
.link{color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:2px}
.link svg{width:16px;height:16px}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:44%;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr);scroll-padding-left:var(--gl)}
.foot{text-align:center;font-size:12px;color:var(--dim);padding-top:4px}

/* Карточка подарка */
.gcard{display:flex;flex-direction:column;padding:7px 7px 10px;border-radius:20px;cursor:pointer;scroll-snap-align:start;min-width:0}
.gimg{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--ph)}
.gimg img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:99px;background:rgba(10,10,11,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:600 11px/1 var(--f-ui);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tag svg{width:11px;height:11px}
.tag.n{top:7px;right:7px}.tag.m{left:7px;bottom:7px}
.gmeta{padding:9px 4px 0;display:grid;gap:4px;min-width:0}
.gname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.gprice{font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cart{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line)}
.cart svg{width:17px;height:17px}

/* Каталог */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:500}
.chip svg{width:14px;height:14px}
.chip.on{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:99px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:0}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{filter:invert(1);opacity:.5}
.fbtn{position:relative;width:46px;height:46px}
.fbtn.on::after{content:"";position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--fg)}
.count{font-size:13px;color:var(--muted);margin-bottom:-6px;min-height:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:36px 16px;color:var(--muted)}
.empty h3{margin:0;color:var(--fg);font:500 22px/1.2 var(--f-display)}
.empty .btn{width:auto;height:46px;margin-top:6px}

/* Страница подарка */
.dimg{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--ph);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.dimg img{width:100%;height:100%;object-fit:cover}
.dimg .tag{font-size:12px;padding:6px 10px}
.dimg .tag.n{top:12px;right:12px}.dimg .tag.m{left:12px;bottom:12px}
.dhead{text-align:center;display:grid;gap:4px}
.dhead h1{margin:0;font:500 34px/1.1 var(--f-display);text-wrap:balance}
.dhead p{margin:0;color:var(--muted)}
.attrs{padding:2px 16px}
.arow{display:grid;grid-template-columns:22px auto minmax(0,1fr) auto;align-items:center;gap:12px;min-height:50px}
.arow+.arow{border-top:1px solid var(--line)}
.arow svg{width:20px;height:20px;color:var(--muted)}
.arow .k{color:var(--muted);font-size:14px}
.arow .v{justify-self:end;text-align:right;font-weight:500;font-size:14.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rar{font:600 12px/1 var(--f-ui);padding:5px 8px;border-radius:99px;background:var(--chip);font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:16px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 64%,rgba(10,10,11,0))}
.bar-in{max-width:440px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.bar-price small{display:block;font-size:12px;color:var(--muted)}
.bar-price b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;padding:0 22px;border-radius:99px;font-size:16px;font-weight:600;transition:transform .12s,opacity .2s;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-p{background:var(--cta);color:var(--on-cta);box-shadow:0 8px 28px rgba(255,255,255,.08)}
.btn-g{background:var(--glass);border:1px solid var(--line-2);box-shadow:var(--hi)}
.btn-d{color:var(--bad)}

/* Вкладки и списки */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:99px}
.seg button{height:40px;border-radius:99px;font-size:14px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0}
.seg button.on{background:var(--cta);color:var(--on-cta)}
.seg.s3 button{font-size:13px;gap:4px}
.cnt{font:600 11px/1 var(--f-ui);padding:3px 7px;border-radius:99px;background:var(--chip)}
.seg .on .cnt{background:rgba(0,0,0,.12)}
.list{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 12px 9px 9px;border-radius:18px;width:100%;text-align:left}
.thumb{width:56px;height:56px;border-radius:13px;overflow:hidden;background:var(--ph);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.ic{display:grid;place-items:center;font:600 22px/1 var(--f-ui);border:1px solid var(--line);background:rgba(255,255,255,.04)}
.lt{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ls{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;margin-top:2px}
.ls svg{width:12px;height:12px;flex:none}
.lr{display:grid;justify-items:end;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.lr .amt{font-size:14px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.lgo{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.lgo svg{width:18px;height:18px;color:var(--dim)}
.st{font:600 12px/1 var(--f-ui);padding:5px 9px;border-radius:99px;white-space:nowrap}
.st.wait{color:var(--warn);background:var(--warn-bg)}
.st.ok{color:var(--ok);background:var(--ok-bg)}
.st.bad{color:var(--bad);background:var(--bad-bg)}
.st.done{color:var(--fg);background:var(--chip)}
.st.off{color:var(--dim);background:rgba(255,255,255,.05)}

/* Вывод, пополнение */
.wcard{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:center;padding:12px;border-radius:22px}
.wcard .thumb{width:104px;height:104px;border-radius:16px}
.wcard h2{margin:0 0 4px;font:500 24px/1.15 var(--f-display);overflow-wrap:anywhere}
.kvs{border-radius:20px;padding:2px 0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 16px;font-size:15px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.kv.neg b{color:var(--bad)}
.note{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:14px 16px;border-radius:18px;font-size:13.5px;color:var(--muted);line-height:1.45}
.note svg{width:20px;height:20px}
/* minmax(0,1fr) и width:100% обязательны: у input есть собственная ширина (атрибут size),
   и без них поле распирало страницу до ~600px — телефон уменьшал масштаб всего экрана. */
.amt-box{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.amt-l{font-size:13px;color:var(--muted)}
.amt-in{display:flex;align-items:baseline;gap:8px}
.amt-in input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font:600 40px/1.15 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:0}
.amt-in input::placeholder{color:var(--dim)}
.amt-in span{font:500 30px/1 var(--f-ui);color:var(--muted)}
.amt-e{font-size:13px;color:var(--muted);min-height:19px}
.amt-e.bad{color:var(--bad)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa button{height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.qa button.on{background:var(--cta);color:var(--on-cta);border-color:var(--cta)}
.cp{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--fg)}
.cp svg{width:16px;height:16px}
.big-sum{text-align:center;display:grid;gap:4px;padding:4px 0}
.big-sum small{color:var(--muted);font-size:13px}
.big-sum b{font:600 38px/1.1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.upl{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1px dashed var(--line-2);cursor:pointer}
.upl svg{width:22px;height:22px}
.upl b{display:block;font-weight:500;font-size:15px}
.upl small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.upl input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.upl:focus-within{outline:2px solid var(--fg);outline-offset:2px}

/* Профиль */
.prof{display:grid;justify-items:center;gap:4px;text-align:center;padding-top:6px}
.ava{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font:500 32px/1 var(--f-display);background:linear-gradient(145deg,#3a3a3f,#141416);border:1px solid var(--line-2)}
.ava img{width:100%;height:100%;object-fit:cover}
.prof h1{margin:8px 0 0;font:500 26px/1.15 var(--f-display);overflow-wrap:anywhere}
.prof p{margin:0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:14px 4px;border-radius:20px}
.stats div{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats span{font-size:12px;color:var(--muted)}
.menu{border-radius:20px;padding:2px 0}
.mi{display:grid;grid-template-columns:22px minmax(0,1fr) 18px;align-items:center;gap:14px;width:100%;min-height:54px;padding:0 16px;text-align:left;font-size:15px}
.mi+.mi{border-top:1px solid var(--line)}
.mi svg{width:20px;height:20px}
.mi .chev{width:18px;height:18px;color:var(--dim)}

/* Шторка */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.ov.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:440px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--sheet);border:1px solid var(--line-2);border-bottom:0;border-radius:28px 28px 0 0;padding:10px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:0 auto 16px}
.sh{display:grid;gap:14px}
.sh h3{margin:0;font:500 25px/1.2 var(--f-display);text-align:center;text-wrap:balance}
.sh p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;text-align:center}
.sh .kvs{background:rgba(255,255,255,.035);border:1px solid var(--line)}
.sh-head{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.sh-head .thumb{width:64px;height:64px;border-radius:14px}
.sh-t{font:500 21px/1.2 var(--f-display);overflow-wrap:anywhere}
.sh-s{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}
.sh-s svg{width:12px;height:12px}
.btns{display:grid;gap:10px;margin-top:2px}
.steps{display:grid;gap:16px;padding:8px 4px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;color:var(--dim);font-size:15px}
.step i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.step.run{color:var(--fg)}
.step.run i{border-color:var(--fg);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--fg)}
.step.done i{background:var(--cta);border-color:var(--cta);color:var(--on-cta)}
.step i svg{width:16px;height:16px;stroke-width:2.6}
@keyframes spin{to{transform:rotate(360deg)}}
.okmark{width:72px;height:72px;border-radius:50%;margin:2px auto 0;display:grid;place-items:center;background:var(--cta);color:var(--on-cta)}
.okmark svg{width:34px;height:34px;stroke-width:2.4}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 20px;align-items:center;width:100%;min-height:52px;padding:0 16px;border-radius:16px;text-align:left;font-size:15px}
.opt.on{background:rgba(255,255,255,.07)}
.opt svg{width:20px;height:20px}
.how{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}
.how .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font-weight:600;font-size:14px}
.how b{display:block;font-weight:600}
.how span{color:var(--muted);font-size:14px}

/* Уведомление снизу, над нижней панелью: сверху оно перекрывало вкладки экрана. */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,8px);z-index:60;width:max-content;max-width:calc(100% - 32px);padding:11px 16px;border-radius:18px;background:rgba(30,30,33,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;display:flex;gap:8px;align-items:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.has-bar .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.toast svg{width:18px;height:18px;flex:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr"></header>
  <main id="view"></main>
</div>
<div id="bar" class="bar" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
/* Scalt — интерактивное демо Mini App (только интерфейс).
   Баланс, покупки и заявки имитируются в браузере (localStorage); реальных платежей,
   запросов к Portals/MRKT/Tonnel и сервера здесь нет. Порядок шагов в имитации повторяет
   будущий настоящий процесс: проверка баланса → покупка на маркете → подарок в инвентаре;
   пополнение и вывод проходят через заявку администратору. */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';
const pct = s => String(s).replace('.', ',');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const DAY = 864e5;
const MIN = 1000, MAX = 5000000;           // лимиты пополнения в демо; реальные задаёт владелец
const DEMO_CONFIRM_MS = 8000;              // через сколько демо «админ» подтверждает пополнение
const IMG = 'assets/gifts/';

/* ---------- Иконки ---------- */
const I = {
  back:'<path d="M15 18l-6-6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17v3"/><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="16.5" cy="14" r="1.2"/>',
  box:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  swap:'<path d="M8 20V4L4.5 7.5M16 4v16l3.5-3.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  filter:'<path d="M4 7h16M7 12h10M10 17h4"/>',
  cart:'<path d="M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  send:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4 18-7z"/>',
  symbol:'<path d="M12 4c2 2.5 2 5.5 0 8-2-2.5-2-5.5 0-8zM12 12c2 2.5 2 5.5 0 8-2-2.5-2-5.5 0-8zM4 12c2.5-2 5.5-2 8 0-2.5 2-5.5 2-8 0zM12 12c2.5-2 5.5-2 8 0-2.5 2-5.5 2-8 0z"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.5 1.7-1.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/>',
  hash:'<path d="M5 9h15M4 15h15M10 3L8 21M16 3l-2 18"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .8c0 1.8-2.5 2.2-2.5 3.7M12 17h.01"/>',
  chat:'<path d="M5 18.5L3.5 21l4-1.2A9 9 0 1 0 5 18.5z"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z" fill="currentColor"/></svg>';

/* Маркеты: собственные нейтральные значки, не логотипы площадок */
const MK = { portals:'Portals', mrkt:'MRKT', tonnel:'Tonnel' };
const MKI = {
  portals:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  mrkt:'<path d="M12 3l8 9-8 9-8-9 8-9z"/>',
  tonnel:'<path d="M4 20V11a8 8 0 0 1 16 0v9"/><path d="M9 20v-7a3 3 0 0 1 6 0v7"/>',
};
const mkIc = m => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MKI[m]}</svg>`;

/* ---------- Демо-каталог ----------
   Подарки, номера, модели, фоны, узоры, редкость и тираж — настоящие (страницы t.me/nft, 16.11.2026).
   Маркет и цена в тенге — примерные, для демонстрации. */
const GIFTS = [
  {id:'PartySparkler-99201', title:'Party Sparkler', num:99201, img:'partysparkler-99201.webp', model:['Bubblegum','1.4%'], backdrop:['Ivory White','1.5%'], symbol:['Stocking','1.2%'], issued:'190 567 / 243 771', market:'portals', price:2900},
  {id:'LunarSnake-15272', title:'Lunar Snake', num:15272, img:'lunarsnake-15272.webp', model:['Prismatic','0.5%'], backdrop:['Electric Indigo','1%'], symbol:['Candy','1.2%'], issued:'202 825 / 259 346', market:'mrkt', price:3400},
  {id:'JellyBunny-40210', title:'Jelly Bunny', num:40210, img:'jellybunny-40210.webp', model:['Vanilla','0.5%'], backdrop:['Emerald','2%'], symbol:['Ball','0.5%'], issued:'108 853 / 129 350', market:'mrkt', price:5400},
  {id:'WitchHat-17733', title:'Witch Hat', num:17733, img:'witchhat-17733.webp', model:['Color Spray','1.5%'], backdrop:['Navy Blue','2%'], symbol:['Baphomet','1.6%'], issued:'82 937 / 88 480', market:'mrkt', price:4300},
  {id:'HomemadeCake-88312', title:'Homemade Cake', num:88312, img:'homemadecake-88312.webp', model:['Frosted Mint','1.5%'], backdrop:['Black','2%'], symbol:['Cap','0.4%'], issued:'180 752 / 199 482', market:'tonnel', price:3200},
  {id:'SakuraFlower-6612', title:'Sakura Flower', num:6612, img:'sakuraflower-6612.webp', model:['Crimsonia','1.3%'], backdrop:['Carmine','1.5%'], symbol:['Bowler Hat','0.5%'], issued:'88 009 / 93 115', market:'portals', price:7500},
  {id:'SnowGlobe-9876', title:'Snow Globe', num:9876, img:'snowglobe-9876.webp', model:['Green Villa','3%'], backdrop:['Fandango','1.5%'], symbol:['Hot Drink','1.5%'], issued:'55 841 / 72 788', market:'tonnel', price:6800},
  {id:'ToyBear-31845', title:'Toy Bear', num:31845, img:'toybear-31845.webp', model:['Noir Et Rose','2%'], backdrop:['Azure Blue','1.5%'], symbol:['Love Daisy','0.4%'], issued:'56 267 / 57 724', market:'mrkt', price:27900},
  {id:'DurovsCap-2741', title:'Durov’s Cap', num:2741, img:'durovscap-2741.webp', model:['Corkwood','2%'], backdrop:['Ivory White','2%'], symbol:['Champagne','1%'], issued:'4 710 / 4 774', market:'tonnel', price:690000},
  {id:'PlushPepe-1834', title:'Plush Pepe', num:1834, img:'plushpepe-1834.webp', model:['Kung Fu Pepe','2%'], backdrop:['Desert Sand','1.5%'], symbol:['Light Bulb','0.5%'], issued:'2 825 / 2 861', market:'portals', price:3450000},
  {id:'IceCream-24616', title:'Ice Cream', num:24616, img:'icecream-24616.webp', model:['Pawpsicle','2%'], backdrop:['Onyx Black','1.2%'], symbol:['Bug','0.7%'], issued:'329 060 / 342 255', market:'tonnel', price:2300},
  {id:'LolPop-120455', title:'Lol Pop', num:120455, img:'lolpop-120455.webp', model:['Spectrum','1.2%'], backdrop:['Silver Blue','1.5%'], symbol:['All-Seeing Eye','0.4%'], issued:'435 246 / 468 745', market:'portals', price:2100},
  {id:'SantaHat-21409', title:'Santa Hat', num:21409, img:'santahat-21409.webp', model:['Jingle Bells','0.5%'], backdrop:['Pure Gold','2%'], symbol:['Chest','2.4%'], issued:'72 102 / 89 034', market:'portals', price:3900},
];
const G = Object.fromEntries(GIFTS.map(g => [g.id, g]));

/* Начальное состояние согласовано по деньгам: пополнения 20 800 − покупки 8 300 = баланс 12 500. */
function seed() {
  const now = Date.now(), t = (d, h = 0) => now - d * DAY - h * 36e5;
  return {
    v: 1, balance: 12500,
    listing: ['PartySparkler-99201','LunarSnake-15272','JellyBunny-40210','WitchHat-17733','HomemadeCake-88312','SakuraFlower-6612','SnowGlobe-9876','ToyBear-31845','DurovsCap-2741','PlushPepe-1834'],
    owned: ['LolPop-120455','IceCream-24616'],
    purchases: [
      {id:'p3', gift:'LolPop-120455', price:2100, at:t(1,3)},
      {id:'p2', gift:'IceCream-24616', price:2300, at:t(2,1)},
      {id:'p1', gift:'SantaHat-21409', price:3900, at:t(5,2)},
    ],
    deposits: [
      {id:'d2', amount:5800, code:'SC-3187', at:t(2,2), status:'ok', receipt:'kaspi_check.jpg'},
      {id:'d1', amount:15000, code:'SC-2045', at:t(5,4), status:'ok', receipt:''},
    ],
    withdrawals: [{id:'w1', gift:'SantaHat-21409', at:t(4,6), status:'done'}],
  };
}
const KEY = 'scalt-demo-v1';
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && Array.isArray(s.listing)) return s; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

/* ---------- Telegram ----------
   SDK подключается только внутри Telegram: в обычном браузере демо работает без него.
   В Telegram «Назад» — нативная кнопка в шапке Telegram, поэтому свою кнопку не дублируем. */
let tg = null, tgUser = null;
const inTG = /tgWebApp/i.test(location.hash + location.search) || 'TelegramWebviewProxy' in window;
function initTG() {
  tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  try {
    tg.ready(); tg.expand();
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) { tg.setHeaderColor('#0A0A0B'); tg.setBackgroundColor('#0A0A0B'); }
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.10')) tg.setBottomBarColor('#0A0A0B');
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
  } catch (e) {}
  tgUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  tg.BackButton.onClick(() => (sheetOpen ? closeSheet() : back()));
  render('none');
}
if (inTG) { const s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js'; s.onload = initTG; document.head.appendChild(s); }
const hap = kind => { try { if (!tg || !tg.HapticFeedback) return; kind === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const me = () => tgUser
  ? { name: [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || 'Пользователь', handle: tgUser.username ? '@' + tgUser.username : '', photo: /^https:\/\//.test(tgUser.photo_url || '') ? tgUser.photo_url : '' }
  : { name: 'Демо-пользователь', handle: '@demo_user', photo: '' };

/* ---------- Форматирование ---------- */
function when(ts) {
  const d = new Date(ts), n = new Date();
  const t = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / DAY);
  if (diff === 0) return 'Сегодня, ' + t;
  if (diff === 1) return 'Вчера, ' + t;
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + t;
}
const DEP_ST = { wait:['wait','На проверке'], ok:['ok','Зачислено'], bad:['bad','Отклонено'] };
const WD_ST = { wait:['wait','Ожидает'], work:['wait','В работе'], done:['done','Выдан'], cancel:['off','Отменена'], bad:['bad','Отклонена'] };
const pill = ([cls, label]) => `<span class="st ${cls}">${label}</span>`;
const activeReqs = () => state.deposits.filter(d => d.status === 'wait').length + state.withdrawals.filter(w => w.status === 'wait' || w.status === 'work').length;
const thumb = g => `<div class="thumb"><img src="${IMG}${g.img}" alt="" loading="lazy" decoding="async"></div>`;
const gsub = g => `#${g.num} · ${mkIc(g.market)}${MK[g.market]}`;

/* ---------- Навигация ----------
   Стек экранов: «Назад» возвращает на предыдущий экран с сохранёнными данными и прокруткой.
   После отправки заявки формы убираются из стека, чтобы «Назад» не вело к повторной отправке. */
let stack = [{ name: 'home', params: {} }];
const top = () => stack[stack.length - 1];
const view = $('#view'), hdr = $('#hdr'), bar = $('#bar'), toastEl = $('#toast');
let curTitle = '';
function go(name, params = {}) { top().scroll = scrollY; stack.push({ name, params }); render('fwd'); }
function back() { if (stack.length > 1) { stack.pop(); render('bk'); } }
function replaceTop(name, params = {}) { stack[stack.length - 1] = { name, params }; render('fwd'); }
function rerender() { const y = scrollY; render('none'); scrollTo(0, y); }

function render(dir) {
  const t = top(), s = SCREENS[t.name](t.params);
  view.innerHTML = `<section class="screen ${dir === 'fwd' ? 'fwd' : dir === 'bk' ? 'bk' : ''}">${s.html}</section>`;
  curTitle = s.title;
  header();
  if (s.bar) { bar.innerHTML = `<div class="bar-in">${s.bar}</div>`; bar.hidden = false; document.body.classList.add('has-bar'); }
  else { bar.hidden = true; bar.innerHTML = ''; document.body.classList.remove('has-bar'); }
  if (s.mount) s.mount();
  if (dir === 'bk') scrollTo(0, t.scroll || 0); else if (dir === 'fwd') scrollTo(0, 0);
  if (tg) (stack.length > 1 || sheetOpen) ? tg.BackButton.show() : tg.BackButton.hide();
}
function header() {
  const isHome = top().name === 'home';
  const canBack = stack.length > 1 && !tg;
  hdr.innerHTML = `
    <div class="hdr-l">${canBack ? `<button class="ibtn" data-act="back" aria-label="Назад">${ic('back')}</button>` : ''}</div>
    <div class="hdr-title ${isHome ? 'brand' : ''}">${STAR}<span>${esc(curTitle)}</span></div>
    <div class="hdr-r">${isHome ? '<span class="pill-demo">Демо</span>'
      : `<button class="balchip" data-act="topup" aria-label="Баланс ${fmt(state.balance)}, пополнить">${ic('wallet')}<span>${fmt(state.balance)}</span></button>`}</div>`;
}
addEventListener('scroll', () => hdr.classList.toggle('scrolled', scrollY > 4), { passive: true });

/* ---------- Компоненты ---------- */
const card = g => `
  <div class="card gcard" role="button" tabindex="0" data-act="gift" data-id="${g.id}" aria-label="${esc(g.title)} #${g.num}, ${fmt(g.price)}">
    <div class="gimg"><img src="${IMG}${g.img}" alt="" loading="lazy" decoding="async"><span class="tag n">#${g.num}</span><span class="tag m">${mkIc(g.market)}${MK[g.market]}</span></div>
    <div class="gmeta"><div class="gname">${esc(g.title)}</div>
      <div class="grow"><span class="gprice">${fmt(g.price)}</span><button class="cart" data-act="buy" data-id="${g.id}" aria-label="Купить ${esc(g.title)}">${ic('cart')}</button></div></div>
  </div>`;
const tile = (to, icn, label, n) => `<button class="card tile" data-act="nav" data-to="${to}">${n ? `<span class="badge">${n}</span>` : ''}${ic(icn)}<span>${label}</span></button>`;
const arow = (icn, k, v, r) => `<div class="arow">${ic(icn)}<span class="k">${k}</span><span class="v">${esc(v)}</span>${r ? `<span class="rar">${pct(r)}</span>` : '<span></span>'}</div>`;
const kv = (k, v, cls = '') => `<div class="kv ${cls}"><span>${k}</span><b>${v}</b></div>`;
const seg = (tabs, cur) => `<div class="card seg ${tabs.length > 2 ? 's3' : ''}" role="tablist">${tabs.map(([key, label, n]) =>
  `<button class="${cur === key ? 'on' : ''}" role="tab" aria-selected="${cur === key}" data-act="tab" data-tab="${key}">${label}${n != null ? ` <span class="cnt">${n}</span>` : ''}</button>`).join('')}</div>`;
const empty = (title, text, btn) => `<div class="empty"><h3>${title}</h3><div>${text}</div>${btn || ''}</div>`;
const BOX = `<svg viewBox="0 0 220 170" aria-hidden="true">

function renderGrid() {
  const q = cat.q.trim().toLowerCase();
  const list = state.listing.map(id => G[id]).filter(g =>
    (cat.market === 'all' || g.market === cat.market) &&
    (!q || `${g.title} ${g.model[0]} ${g.num}`.toLowerCase().includes(q.replace(/^#/, ''))));
  if (cat.sort === 'cheap') list.sort((a, b) => a.price - b.price);
  else if (cat.sort === 'exp') list.sort((a, b) => b.price - a.price);
  else if (cat.sort === 'rare') list.sort((a, b) => parseFloat(a.model[1]) - parseFloat(b.model[1]));
  $('#count').textContent = list.length ? `${list.length} ${plural(list.length, 'подарок', 'подарка', 'подарков')}${cat.market !== 'all' ? ' на ' + MK[cat.market] : ''}` : '';
  const grid = $('#grid');
  grid.className = list.length ? 'grid' : '';
  grid.innerHTML = list.length ? list.map(card).join('')
    : empty('Ничего не нашли', 'Попробуйте другое название или маркет.', `<button class="btn btn-g" data-act="resetFilters">Сбросить фильтры</button>`);
}

/* Поле суммы: только цифры, проверка лимитов и подсветка быстрых сумм без перерисовки экрана (иначе пропадёт фокус). */
function amountChanged(p) {
  const inp = $('#amount'), err = $('#amt-e'), next = $('#next');
  if (!inp) return;
  const n = +(inp.value.replace(/\D/g, '').slice(0, 8)) || 0;
  p.amount = n;
  inp.value = n ? n.toLocaleString('ru-RU') : '';
  const ok = n >= MIN && n <= MAX;
  err.textContent = !n ? `От ${fmt(MIN)} до ${fmt(MAX)}` : n < MIN ? `Минимум ${fmt(MIN)}` : n > MAX ? `Максимум ${fmt(MAX)}` : `К оплате ${fmt(n)}`;
  err.classList.toggle('bad', !!n && !ok);
  next.disabled = !ok;
  document.querySelectorAll('.qa button').forEach(b => b.classList.toggle('on', +b.dataset.v === n));
}

/* ---------- Шторка и уведомления ---------- */
let sheetOpen = false, ovEl = null, shEl = null, buying = false;
function openSheet(html) {
  if (sheetOpen) { shEl.innerHTML = '<div class="grab"></div>' + html; return; }
  ovEl = document.createElement('div'); ovEl.className = 'ov'; ovEl.dataset.act = 'close';
  shEl = document.createElement('div'); shEl.className = 'sheet'; shEl.setAttribute('role', 'dialog'); shEl.setAttribute('aria-modal', 'true');
  shEl.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(ovEl, shEl);
  document.body.style.overflow = 'hidden';
  void shEl.offsetHeight;                   // фиксируем начальное положение, чтобы сработала анимация выезда
  ovEl.classList.add('open'); shEl.classList.add('open');
  sheetOpen = true;
  if (tg) tg.BackButton.show();
  const f = shEl.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function closeSheet() {
  // Пока идёт покупка, шторку не закрываем: процесс уже запущен и должен показать итог.
  if (!sheetOpen || buying) return;
  sheetOpen = false;
  const o = ovEl, s = shEl;
  o.classList.remove('open'); s.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { o.remove(); s.remove(); }, 300);
  if (tg && stack.length <= 1) tg.BackButton.hide();
}
let toastT;
function toast(msg, icon = 'check') {
  toastEl.innerHTML = ic(icon) + '<span>' + esc(msg) + '</span>';
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2800);
}
const sheetHead = g => `<div class="sh-head">${thumb(g)}<div style="min-width:0"><div class="sh-t">${esc(g.title)}</div><div class="sh-s">${gsub(g)}</div></div></div>`;

/* ---------- Покупка ---------- */
const roundUp = n => Math.max(MIN, Math.ceil(n / 500) * 500);
function openBuy(id) {
  const g = G[id];
  if (!state.listing.includes(id)) { toast('Этот подарок уже купили', 'info'); return; }
  const need = g.price - state.balance;
  openSheet(`<div class="sh" id="buysh">
    ${sheetHead(g)}
    <div class="kvs">
      ${kv('Цена', fmt(g.price))}
      ${kv('Ваш баланс', fmt(state.balance))}
      ${need > 0 ? kv('Не хватает', fmt(need), 'neg') : kv('Останется', fmt(state.balance - g.price))}
    </div>
    <p>${need > 0 ? 'Пополните баланс, и подарок можно будет купить.' : `Купим на ${MK[g.market]} сразу после подтверждения. Подарок появится в инвентаре.`}</p>
    <div class="btns">
      ${need > 0 ? `<button class="btn btn-p" data-act="topupNeed" data-amount="${roundUp(need)}">${ic('plus')}Пополнить на ${fmt(roundUp(need))}</button>`
                 : `<button class="btn btn-p" data-act="confirmBuy" data-id="${id}">Купить за ${fmt(g.price)}</button>`}
      <button class="btn btn-g" data-act="close">Отмена</button>
    </div></div>`);
}
async function confirmBuy(id) {
  if (buying) return;                       // защита от двойного нажатия
  const g = G[id];
  // Повторная проверка в момент подтверждения: подарок могли купить, баланс мог измениться.
  if (!state.listing.includes(id)) { closeSheet(); toast('Этот подарок уже купили', 'info'); rerender(); return; }
  if (state.balance < g.price) { openBuy(id); return; }
  buying = true; hap();
  const sh = $('#buysh');
  sh.innerHTML = sheetHead(g) + `<div class="steps">${[`Списываем ${fmt(g.price)} с баланса`, `Покупаем на ${MK[g.market]}`, 'Кладём в ваш инвентарь']
    .map((s, i) => `<div class="step" id="st${i}"><i></i><span>${esc(s)}</span></div>`).join('')}</div>`;
  for (let i = 0; i < 3; i++) {
    const el = $('#st' + i);
    el.className = 'step run';
    await sleep(i === 1 ? 1200 : 650);
    el.className = 'step done'; el.querySelector('i').innerHTML = ic('check');
  }
  // Состояние меняется одним шагом в конце, чтобы перезагрузка посреди анимации не оставила списание без подарка.
  state.balance -= g.price;
  state.listing = state.listing.filter(x => x !== id);
  state.owned.unshift(id);
  state.purchases.unshift({ id: uid(), gift: id, price: g.price, at: Date.now() });
  save();
  buying = false; hap('ok');
  rerender();
  sh.innerHTML = `<div class="okmark">${ic('check')}</div><h3>Подарок ваш</h3>
    <p>${esc(g.title)} #${g.num} куплен на ${MK[g.market]} и уже лежит в инвентаре. Вывести его в Telegram можно в любой момент.</p>
    <div class="btns"><button class="btn btn-p" data-act="toInv">В инвентарь</button><button class="btn btn-g" data-act="more">Продолжить покупки</button></div>`;
}

/* ---------- Пополнения: демо-подтверждение «администратором» ---------- */
const timers = new Set();
function scheduleDeposits() {
  state.deposits.filter(d => d.status === 'wait' && !timers.has(d.id)).forEach(d => {
    timers.add(d.id);
    setTimeout(() => {
      const x = state.deposits.find(y => y.id === d.id);
      if (!x || x.status !== 'wait') return;
      x.status = 'ok'; state.balance += x.amount; save(); hap('ok');
      toast(`Пополнение на ${fmt(x.amount)} зачислено`);
      // На экранах с полями ввода обновляем только шапку, чтобы не сбить ввод.
      if (['topup', 'withdraw'].includes(top().name)) header(); else rerender();
    }, Math.max(1500, d.at + DEMO_CONFIRM_MS - Date.now()));
  });
}

/* ---------- Детали заявок ---------- */
function openReq(kind, id) {
  const u = me();
  if (kind === 'p') {
    const x = state.purchases.find(y => y.id === id); if (!x) return; const g = G[x.gift];
    const canW = state.owned.includes(x.gift);
    openSheet(`<div class="sh">${sheetHead(g)}<div class="kvs">${kv('Статус', pill(['ok','Куплен']))}${kv('Маркет', MK[g.market])}${kv('Цена', fmt(x.price))}${kv('Дата', when(x.at))}</div>
      <div class="btns">${canW ? `<button class="btn btn-p" data-act="withdraw" data-id="${g.id}">${ic('send')}Вывести</button>` : ''}<button class="btn btn-g" data-act="close">Закрыть</button></div></div>`);
  } else if (kind === 'd') {
    const d = state.deposits.find(y => y.id === id); if (!d) return;
    const text = d.status === 'wait' ? 'Проверяем перевод. Баланс пополнится, как только администратор подтвердит платёж. В демо это происходит само через несколько секунд.'
      : d.status === 'ok' ? 'Сумма зачислена на баланс.' : 'Платёж не найден. Напишите в поддержку и приложите чек.';
    openSheet(`<div class="sh"><div class="big-sum"><small>Пополнение</small><b>+${fmt(d.amount)}</b></div>
      <div class="kvs">${kv('Статус', pill(DEP_ST[d.status]))}${kv('Комментарий', d.code)}${kv('Чек', d.receipt ? esc(d.receipt) : 'не прикреплён')}${kv('Дата', when(d.at))}</div>
      <p>${text}</p><div class="btns"><button class="btn btn-g" data-act="close">Закрыть</button></div></div>`);
  } else {
    const w = state.withdrawals.find(y => y.id === id); if (!w) return; const g = G[w.gift];
    const text = { wait: 'Заявка у администратора. Он передаст подарок на ваш аккаунт и отметит заявку выданной.', work: 'Администратор уже передаёт подарок.',
      done: 'Подарок передан на ваш аккаунт Telegram.', cancel: 'Заявка отменена, подарок вернулся в инвентарь.', bad: 'Заявка отклонена. Подробности в поддержке.' }[w.status];
    openSheet(`<div class="sh">${sheetHead(g)}<div class="kvs">${kv('Статус', pill(WD_ST[w.status]))}${kv('Получатель', esc(u.handle || u.name))}${kv('Дата', when(w.at))}</div>
      <p>${text}</p><div class="btns">${w.status === 'wait' ? `<button class="btn btn-g btn-d" data-act="cancelW" data-id="${w.id}">Отменить заявку</button>` : ''}<button class="btn btn-g" data-act="close">Закрыть</button></div></div>`);
  }
}

/* ---------- Действия ---------- */
const ACT = {
  back: () => back(),
  close: () => closeSheet(),
  nav: el => { closeSheet(); go(el.dataset.to, el.dataset.tab ? { tab: el.dataset.tab } : {}); },
  tab: el => { top().params.tab = el.dataset.tab; rerender(); },
  gift: el => go('gift', { id: el.dataset.id }),
  buy: el => openBuy(el.dataset.id),
  confirmBuy: el => confirmBuy(el.dataset.id),
  topup: () => { if (top().name !== 'topup') { closeSheet(); go('topup'); } },
  topupNeed: el => { closeSheet(); go('topup', { amount: +el.dataset.amount }); },
  toInv: () => { closeSheet(); top().name === 'gift' ? replaceTop('inventory') : go('inventory'); },
  more: () => {
    closeSheet();
    if (top().name !== 'gift') return;
    stack.length > 1 && stack[stack.length - 2].name === 'catalog' ? back() : replaceTop('catalog');
  },
  mk: el => { cat.market = el.dataset.m; rerender(); },
  sort: () => openSheet(`<div class="sh"><h3>Сортировка</h3><div>${SORTS.map(([k, l]) =>
    `<button class="opt ${cat.sort === k ? 'on' : ''}" data-act="setSort" data-s="${k}"><span>${l}</span>${cat.sort === k ? ic('check') : '<span></span>'}</button>`).join('')}</div></div>`),
  setSort: el => { cat.sort = el.dataset.s; closeSheet(); rerender(); },
  resetFilters: () => { cat.market = 'all'; cat.q = ''; cat.sort = 'pop'; rerender(); },
  withdraw: el => { closeSheet(); go('withdraw', { id: el.dataset.id }); },
  sendW: el => {
    const id = el.dataset.id;
    if (!state.owned.includes(id)) return;
    state.owned = state.owned.filter(x => x !== id);
    state.withdrawals.unshift({ id: uid(), gift: id, at: Date.now(), status: 'wait' });
    save(); hap('ok');
    replaceTop('requests', { tab: 'w' });
    toast('Заявка на вывод отправлена');
  },
  cancelW: el => {
    const w = state.withdrawals.find(x => x.id === el.dataset.id);
    if (!w || w.status !== 'wait') return;
    w.status = 'cancel'; state.owned.unshift(w.gift); save();
    closeSheet(); rerender();
    toast('Заявка отменена, подарок в инвентаре');
  },
  req: el => openReq(el.dataset.kind, el.dataset.id),
  amt: el => { const inp = $('#amount'); inp.value = el.dataset.v; amountChanged(top().params); },
  topNext: () => { const p = top().params; if (p.amount >= MIN && p.amount <= MAX) go('topup', { step: 2, amount: p.amount, code: p.code }); },
  copy: el => {
    const v = el.dataset.v;
    const fail = () => toast('Скопируйте вручную: ' + v, 'info');
    try { navigator.clipboard.writeText(v).then(() => toast('Скопировано'), fail); } catch (e) { fail(); }
  },
  paid: () => {
    const p = top().params;
    if (!(p.amount >= MIN)) return;
    state.deposits.unshift({ id: uid(), amount: p.amount, code: p.code, at: Date.now(), status: 'wait', receipt: p.receipt || '' });
    save(); scheduleDeposits(); hap('ok');
    stack.length = Math.max(1, stack.findIndex(e => e.name === 'topup'));
    go('requests', { tab: 'd' });
    toast('Заявка на пополнение отправлена');
  },
  how: () => openSheet(`<div class="sh"><h3>Как это работает</h3><ol class="how">
    <li><span class="n">1</span><div><b>Пополните баланс</b><span>Переведите тенге по реквизитам. Администратор проверит платёж и зачислит сумму.</span></div></li>
    <li><span class="n">2</span><div><b>Выберите подарок</b><span>В каталоге собраны предложения Portals, MRKT и Tonnel.</span></div></li>
    <li><span class="n">3</span><div><b>Покупка сразу</b><span>Мы покупаем подарок на маркете, где он выставлен, и кладём в ваш инвентарь.</span></div></li>
    <li><span class="n">4</span><div><b>Выведите в Telegram</b><span>Оставьте заявку, и администратор передаст подарок на ваш аккаунт.</span></div></li>
    </ol><div class="btns"><button class="btn btn-p" data-act="close">Понятно</button></div></div>`),
  support: () => openSheet(`<div class="sh"><h3>Поддержка</h3><p>Здесь будет кнопка связи с поддержкой магазина. В демо она не подключена.</p><div class="btns"><button class="btn btn-g" data-act="close">Закрыть</button></div></div>`),
  reset: () => openSheet(`<div class="sh"><h3>Сбросить демо?</h3><p>Баланс, инвентарь и заявки вернутся к начальным примерам.</p>
    <div class="btns"><button class="btn btn-p" data-act="doReset">Сбросить</button><button class="btn btn-g" data-act="close">Отмена</button></div></div>`),
  doReset: () => { state = seed(); save(); closeSheet(); stack = [{ name: 'home', params: {} }]; render('bk'); toast('Демо-данные сброшены'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'receipt') return;
  const f = e.target.files && e.target.files[0];
  top().params.receipt = f ? f.name : '';
  const r = $('#rname'); if (r) r.textContent = f ? f.name : 'Скриншот или PDF, ускорит проверку';
});

render('none');
scheduleDeposits();
})();
</script>
</body>
</html>
